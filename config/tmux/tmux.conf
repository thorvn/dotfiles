# Unbind
set -g prefix2 None

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# use vim keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-close-target
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# Pane Controls
bind c new-window -c "#{pane_current_path}"
bind H split-window -h -c "#{pane_current_path}"
bind V split-window -v -c "#{pane_current_path}"
bind x kill-pane

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind Left resize-pane -L 5
bind Down resize-pane -D 5
bind Up resize-pane -U 5
bind Right resize-pane -R 5

# Windows navigation
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

#-------------------------------------- General --------------------------------------#
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -s escape-time 0                     # faster command sequences
set -g focus-events on
set -g history-limit 50000                 # boost history
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title
set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 600      # slightly longer status messages display time

# Session switcher (fzf)
bind s display-popup -w 50% -h 40% -E "$HOME/.config/tmux/scripts/session-switcher.sh"

# Popup
bind o display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind -n M-r display-popup -d "#{pane_current_path}" -w 80% -h 70% -E "go run . ; echo '\n--- Nhấn Enter để đóng ---' ; read"

#-------------------------------------- Theme --------------------------------------#
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# status left - session name
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e,nobold] "

# status right - git, cpu, ram, time
set -g status-right-length 180
set -g status-right "#[fg=#89b4fa]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#[fg=#cdd6f4,bg=#45475a] CPU: #{cpu_percentage} #[fg=#a6e3a1,bg=#45475a] RAM: #{ram_percentage} #[fg=#f9e2af,bg=#45475a] %h-%d %H:%M "

# pane borders - per-pane Claude cache countdown (one session per pane)
# Driven by cache-border-daemon.sh: tmux's #() can't refresh per-pane reliably (tmux#1852),
# so a background loop sets each pane's border directly once per second.
set -g pane-border-status top
set -g pane-border-format "#[fg=#6c7086] #{b:pane_current_path} "
# run-shell -b "$HOME/.config/tmux/scripts/cache-border-daemon.sh"
run-shell -b "$HOME/.config/tmux/scripts/cache-border-daemon.sh"
set-hook -g session-created "run-shell -b '$HOME/.config/tmux/scripts/cache-border-daemon.sh'"

# window status
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I|#[fg=#cdd6f4]#{pane_current_command}|#[fg=#6c7086]#{b:pane_current_path} "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I|#{pane_current_command}|#{b:pane_current_path} #[fg=#cba6f7,bg=#1e1e2e,nobold]"
# set -g window-status-separator ""
set -g window-status-activity-style bg=#1e1e2e,fg=#f9e2af

##+-------+
#+ Panes +
##+-------+
set -g pane-border-style bg=default,fg=#45475a
set -g pane-active-border-style bg=default,fg=#89b4fa

#+------------+
#+ Messages +
#+---------+
set -g message-style bg=#45475a,fg=#cdd6f4
set -g message-command-style bg=#45475a,fg=#cdd6f4

#+------------+
#+ Clock Mode +
#+------------+
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @sidebar-tree 'e'
set -g @sidebar-tree-focus 'w'
set -g @sidebar-tree-command 'tree -C'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


run '~/.config/tmux/plugins/tpm/tpm'
