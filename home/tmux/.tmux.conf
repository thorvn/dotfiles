#-------------------------------------- General --------------------------------------#

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# set prefix key to Ctrl+p
unbind C-b
set-option -g prefix C-p
bind-key C-p send-prefix

setw -g xterm-keys on
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -g focus-events on

set -g history-limit 5000                 # boost history

# enable mouse mode
set -g mouse on

#-------------------------------------- Display --------------------------------------#

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title
set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 600      # slightly longer status messages display time

#----- Keys settings ------#

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use PREFIX v to split window vertically and PREFIX s to split horizontally
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

#-------------------------------------- Buffers --------------------------------------#
bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from

# use vim keybindings in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-close-target

#-------------------------------------- Custom keybinding --------------------------------------#
bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5

#-------------------------------------- Theme --------------------------------------#
set -g status-position top
set -g status-interval 10
set -g status-justify left
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# status left - session name
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e,nobold] "

# status right - git, cpu, ram, time
set -g status-right-length 150
set -g status-right "#[fg=#cdd6f4,bg=#45475a] CPU: #{cpu_percentage} #[fg=#a6e3a1,bg=#45475a] RAM: #{ram_percentage} #[fg=#f9e2af,bg=#45475a] %h-%d %H:%M "

# window status
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I. #[fg=#cdd6f4,bg=#1e1e2e]#(basename #{pane_current_path}) "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I. #[fg=#1e1e2e,bg=#cba6f7,bold]#(basename #{pane_current_path}) #[fg=#cba6f7,bg=#1e1e2e,nobold]"
# set -g window-status-separator ""
set -g window-status-activity-style bg=#1e1e2e,fg=#f9e2af

##+-------+
#+ Panes +
##+-------+
set -g pane-border-style bg=default,fg=#45475a
set -g pane-active-border-style bg=default,fg=#89b4fa

#+------------+
#+ Messages +
#+---------+
set -g message-style bg=#45475a,fg=#cdd6f4
set -g message-command-style bg=#45475a,fg=#cdd6f4

#+------------+
#+ Clock Mode +
#+------------+
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sidebar'


set -g @sidebar-tree 'e'
set -g @sidebar-tree-focus 'w'
set -g @sidebar-tree-command 'tree -C'

run '~/.tmux/plugins/tpm/tpm'
